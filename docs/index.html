<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>CC Switch 文档</title>
    <link rel="icon" href="_media/favicon.ico" />
    <meta
      name="keywords"
      content="cc-switch,cc-switch-router,cc-switch-market,Claude Code,Codex,token,share"
    />
    <meta
      name="description"
      content="CC Switch 项目家族文档：客户端、路由、市场。"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Core Theme -->
    <link
      rel="stylesheet"
      href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css"
    />

    <!-- Theme Add-on(s) -->
    <link
      rel="stylesheet"
      href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/core-dark.min.css"
      media="(prefers-color-scheme: dark)"
      data-group="addon"
      data-sheet="core-dark-auto"
    />
  </head>

  <body class="loading sidebar-chevron-right sidebar-group-box">
    <div id="app"></div>
    <script>
      window.$docsify = {
        name: 'CC Switch',
        nameLink: '#/',
        repo: 'Xiechengqi/tokenswitch-docsify',
        auto2top: true,
        coverpage: true,
        loadSidebar: true,
        loadNavbar: true,
        maxLevel: 4,
        subMaxLevel: 2,
        search: {
          noData: '没有结果',
          placeholder: '搜索',
          paths: 'auto',
          depth: 6,
        },
        plugins: [
          function (hook, vm) {
            hook.beforeEach(html => {
              const path = vm.route.file;
              const url =
                'https://github.com/Xiechengqi/tokenswitch-docsify/blob/develop/docs/' +
                path;
              const footer = [
                '<hr>',
                '<div style="display:flex;justify-content:space-between;align-items:center;font-size:0.9em;color:var(--color-text-secondary,#888);">',
                '  <span>CC Switch · 开源项目家族</span>',
                `  <a href="${url}">编辑此页</a>`,
                '</div>',
              ].join('\n');
              return html + footer;
            });
          },
        ],
      };
    </script>
    <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/docsify.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/search.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/prism.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-toml.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-rust.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-ini.min.js"></script>
  </body>
</html>
