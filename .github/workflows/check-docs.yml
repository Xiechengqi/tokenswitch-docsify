name: Check docs

on:
  push:
    branches: [main, develop]
    paths:
      - 'docs/**'
      - 'tools/check-docs.mjs'
      - '.github/workflows/check-docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'tools/check-docs.mjs'
      - '.github/workflows/check-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sidebar coverage and dead links
        run: node tools/check-docs.mjs
